<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand">Portfolio</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav flex-row gap-3">
        @for (item of navbar; track $index) {
        <li class="nav-item">
          <a class="nav-link" [routerLink]="item.redirection">
            {{ LanguageService.translate(item.key) }}
          </a>
        </li>
        }
      </ul>
      <div class="ms-auto">

        <button class="btn btn-language me-2" (click)="LanguageService.changeLanguage('es')">

          Es
        </button>

        <button class="btn btn-language" (click)="LanguageService.changeLanguage('en')">

          EN
        </button>

      </div>
    </div>
  </div>


</nav>
